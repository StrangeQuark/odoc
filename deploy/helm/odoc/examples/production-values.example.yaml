# Example only. Replace all names and image tags with operator-owned values.
# Odoc expects externally managed PostgreSQL and S3-compatible storage here.
api:
  springProfilesActive: production
  auth: { inviteOnly: true }
  image:
    repository: registry.example.invalid/odoc-api
    tag: release-tag
    pullPolicy: IfNotPresent
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCpuUtilizationPercentage: 70
  database:
    url: jdbc:postgresql://postgres.example.invalid:5432/odoc
    existingSecret: odoc-database
    usernameKey: username
    passwordKey: password
  objectStorage:
    enabled: true
    endpoint: https://storage.example.invalid
    region: us-east-1
    bucket: odoc-media
    pathStyle: false
    requireTls: true
    existingSecret: odoc-object-storage
    accessKeyKey: access-key
    secretKeyKey: secret-key
  encryption:
    enabled: true
    existingSecret: odoc-encryption
    wrappingKeyKey: wrapping-key-base64

frontend:
  runtime: { apiBasePath: /api/v1, release: release-tag }
  image:
    repository: registry.example.invalid/odoc-frontend
    tag: release-tag
    pullPolicy: IfNotPresent
  replicaCount: 2

ingress:
  enabled: true
  className: nginx
  host: odoc.example.invalid
  tlsSecretName: odoc-edge-tls
