# Illustrative production values. Replace every hostname, image digest, and
# referenced Secret/ConfigMap name with operator-owned resources. This file
# contains no credentials and is not a deployable environment configuration.
api:
  springProfilesActive: api
  image:
    repository: registry.example.invalid/odoc-api
    tag: sha256-pinned-release
    pullPolicy: IfNotPresent
  replicaCount: 2
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCpuUtilizationPercentage: 70
  database:
    url: jdbc:postgresql://postgres.example.invalid:5432/odoc?sslmode=verify-full&sslrootcert=/tls/ca.crt
    existingSecret: odoc-database
    usernameKey: username
    passwordKey: password
  serverTls:
    enabled: true
    existingSecret: odoc-api-tls
    keyStoreKey: api.p12
    keyStorePasswordKey: password
    trustBundleConfigMap: odoc-platform-ca
    trustBundleKey: ca.crt

worker:
  springProfilesActive: worker
  image:
    repository: registry.example.invalid/odoc-api
    tag: sha256-pinned-release
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { cpu: 500m, memory: 768Mi }
  database:
    url: jdbc:postgresql://postgres.example.invalid:5432/odoc?sslmode=verify-full&sslrootcert=/tls/ca.crt
    existingSecret: odoc-database
    usernameKey: username
    passwordKey: password
  trustBundleConfigMap: odoc-platform-ca
  trustBundleKey: ca.crt

frontend:
  runtime: { apiBasePath: /api/v1, release: sha256-pinned-release }
  image:
    repository: registry.example.invalid/odoc-frontend
    tag: sha256-pinned-release
    pullPolicy: IfNotPresent
  replicaCount: 2
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 128Mi }
  upstreamTls:
    enabled: true
    trustBundleConfigMap: odoc-platform-ca
    trustBundleKey: ca.crt

ingress:
  enabled: true
  className: nginx
  host: odoc.example.invalid
  tlsSecretName: odoc-edge-tls
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 26m
