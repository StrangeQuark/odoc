apiVersion: v1
kind: Service
metadata:
  name: {{ include "odoc.name" . }}-api
  labels:
    {{- include "odoc.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: api
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "odoc.name" . }}-api
  labels:
    {{- include "odoc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: api
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "odoc.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.api.springProfilesActive | quote }}
            - name: ODOC_AUTH_INVITE_ONLY
              value: {{ .Values.api.auth.inviteOnly | quote }}
            - name: SPRING_DATASOURCE_URL
              value: {{ .Values.api.database.url | quote }}
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: {{ .Values.api.database.existingSecret }}, key: {{ .Values.api.database.usernameKey }} } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.api.database.existingSecret }}, key: {{ .Values.api.database.passwordKey }} } }
            - name: ODOC_OBJECT_STORAGE_ENABLED
              value: {{ .Values.api.objectStorage.enabled | quote }}
            {{- if .Values.api.objectStorage.enabled }}
            - name: ODOC_OBJECT_STORAGE_ENDPOINT
              value: {{ .Values.api.objectStorage.endpoint | quote }}
            - name: ODOC_OBJECT_STORAGE_REGION
              value: {{ .Values.api.objectStorage.region | quote }}
            - name: ODOC_OBJECT_STORAGE_BUCKET
              value: {{ .Values.api.objectStorage.bucket | quote }}
            - name: ODOC_OBJECT_STORAGE_PATH_STYLE
              value: {{ .Values.api.objectStorage.pathStyle | quote }}
            - name: ODOC_OBJECT_STORAGE_REQUIRE_TLS
              value: {{ .Values.api.objectStorage.requireTls | quote }}
            - name: ODOC_OBJECT_STORAGE_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.api.objectStorage.existingSecret }}, key: {{ .Values.api.objectStorage.accessKeyKey }} } }
            - name: ODOC_OBJECT_STORAGE_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.api.objectStorage.existingSecret }}, key: {{ .Values.api.objectStorage.secretKeyKey }} } }
            {{- end }}
            - name: ODOC_MANAGED_ENCRYPTION_ENABLED
              value: {{ .Values.api.encryption.enabled | quote }}
            {{- if .Values.api.encryption.enabled }}
            - name: ODOC_MANAGED_ENCRYPTION_WRAPPING_KEY_BASE64
              valueFrom: { secretKeyRef: { name: {{ .Values.api.encryption.existingSecret }}, key: {{ .Values.api.encryption.wrappingKeyKey }} } }
            {{- end }}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          startupProbe:
            exec: { command: ["sh", "-ec", "curl --fail --silent http://127.0.0.1:8081/actuator/health/liveness >/dev/null"] }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            exec: { command: ["sh", "-ec", "curl --fail --silent http://127.0.0.1:8081/actuator/health/readiness >/dev/null"] }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["sh", "-ec", "curl --fail --silent http://127.0.0.1:8081/actuator/health/liveness >/dev/null"] }
            initialDelaySeconds: 15
            periodSeconds: 10
---
{{- if .Values.api.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "odoc.name" . }}-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ include "odoc.name" . }}-api }
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.api.autoscaling.targetCpuUtilizationPercentage }} }
{{- end }}
