apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "odoc.name" . }}-frontend-nginx
  labels:
    {{- include "odoc.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;
      client_max_body_size 26m;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      add_header X-Frame-Options DENY always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
      add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" always;

      location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
      }

      location /api/ {
        proxy_pass {{ if .Values.frontend.upstreamTls.enabled }}https{{ else }}http{{ end }}://{{ include "odoc.name" . }}-api:8080;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        {{- if .Values.frontend.upstreamTls.enabled }}
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/nginx/ca/{{ .Values.frontend.upstreamTls.trustBundleKey }};
        proxy_ssl_server_name on;
        proxy_ssl_name {{ include "odoc.name" . }}-api;
        {{- end }}
        proxy_set_header Host $host;
        # The API rejects ambient proxy headers. An operator that needs a
        # trusted-proxy topology must configure it explicitly with P6.
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-Port "";
      }

      location = /runtime-config.json {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" always;
        add_header Cache-Control 'no-store' always;
        alias /tmp/odoc-runtime-config.json;
      }

      location ~* \.(?:css|js|woff2?|png|jpe?g|gif|webp|svg)$ {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" always;
        add_header Cache-Control 'public, max-age=31536000, immutable' always;
        try_files $uri =404;
      }

      location / {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" always;
        add_header Cache-Control 'no-store' always;
        try_files $uri $uri/ /index.html;
      }
    }
