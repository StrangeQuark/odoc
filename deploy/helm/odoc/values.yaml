# This optional chart deploys the same two application processes as Compose.
# PostgreSQL and S3-compatible storage are supplied by the operator.
api:
  springProfilesActive: local
  auth:
    inviteOnly: false
  image:
    repository: odoc-api
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCpuUtilizationPercentage: 70
  database:
    url: jdbc:postgresql://postgres:5432/odoc
    existingSecret: odoc-database
    usernameKey: username
    passwordKey: password
  objectStorage:
    # Keep false when following the minimal kind tutorial; enable it to use
    # images and attachments with an operator-provided S3-compatible service.
    enabled: false
    endpoint: ""
    region: us-east-1
    bucket: odoc-media
    pathStyle: false
    requireTls: true
    existingSecret: ""
    accessKeyKey: access-key
    secretKeyKey: secret-key
  encryption:
    # Required server-managed encryption key. This is not E2EE.
    enabled: true
    existingSecret: odoc-encryption
    wrappingKeyKey: wrapping-key-base64

frontend:
  runtime:
    apiBasePath: /api/v1
    release: local
  image:
    repository: odoc-frontend
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 128Mi }

ingress:
  enabled: false
  className: ""
  host: odoc.local
  tlsSecretName: ""
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 26m
