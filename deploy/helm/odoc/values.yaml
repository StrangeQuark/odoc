api:
  # The local/private MVP uses email/password cookie sessions. OIDC/OAuth
  # providers remain optional additions.
  springProfilesActive: local
  auth:
    # Require a one-time workspace invitation code when creating an account.
    # Sign-in, recovery, and invitation redemption still work.
    inviteOnly: false
  image:
    repository: odoc-api
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 2
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCpuUtilizationPercentage: 70
  database:
    url: jdbc:postgresql://postgres:5432/odoc
    existingSecret: odoc-database
    usernameKey: username
    passwordKey: password
  serverTls:
    enabled: false
    existingSecret: ""
    keyStoreKey: api.p12
    keyStorePasswordKey: password
    trustBundleConfigMap: ""
    trustBundleKey: ca.crt

worker:
  springProfilesActive: worker
  image:
    repository: odoc-api
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { cpu: 500m, memory: 768Mi }
  database:
    url: jdbc:postgresql://postgres:5432/odoc
    existingSecret: odoc-database
    usernameKey: username
    passwordKey: password
  trustBundleConfigMap: ""
  trustBundleKey: ca.crt

frontend:
  runtime:
    apiBasePath: /api/v1
    release: local
  image:
    repository: odoc-frontend
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 2
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 128Mi }
  upstreamTls:
    enabled: false
    trustBundleConfigMap: ""
    trustBundleKey: ca.crt

ingress:
  enabled: false
  className: ""
  host: odoc.local
  tlsSecretName: ""
  # nginx-ingress honors this; other controllers can override it with their
  # own equivalent in this map.
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 26m

# This Phase 0 chart's in-cluster preview traffic is deliberately HTTP-only.
# Production values must provide the TLS trust/certificate configuration from
# P0-015/P6; the smoke script proves chart wiring, not production transport.
