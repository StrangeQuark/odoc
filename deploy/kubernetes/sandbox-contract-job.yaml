# Reference fixture for untrusted parser/scanner jobs. It deliberately has no
# service account token, credentials, ingress, or network egress. A supervisor
# hands a single bounded tmpfs input to the Job and validates/re-encrypts output.
apiVersion: batch/v1
kind: Job
metadata:
  name: odoc-sandbox-contract
  namespace: odoc
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 60
  template:
    metadata:
      labels: { app.kubernetes.io/name: odoc-sandbox }
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: processor
          image: registry.example.invalid/odoc-processor:replace-me
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "100m", memory: "128Mi", ephemeral-storage: "64Mi" }
            limits: { cpu: "1", memory: "256Mi", ephemeral-storage: "128Mi" }
          volumeMounts:
            - { name: job-tmpfs, mountPath: /work }
      volumes:
        - name: job-tmpfs
          emptyDir: { medium: Memory, sizeLimit: 32Mi }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: odoc-sandbox-deny-all
  namespace: odoc
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: odoc-sandbox } }
  policyTypes: [Ingress, Egress]
