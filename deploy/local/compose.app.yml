services:
  api:
    build:
      context: ../..
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${ODOC_DATABASE_NAME:-odoc}
      SPRING_DATASOURCE_USERNAME: ${ODOC_DATABASE_USERNAME:-odoc}
      SPRING_DATASOURCE_PASSWORD: ${ODOC_DATABASE_PASSWORD:-odoc}
      ODOC_MAIL_HOST: mailpit
      ODOC_MAIL_PORT: 1025
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "${ODOC_API_PORT:-8080}:8080"

  frontend:
    build:
      context: ../../../odoc-react
    depends_on:
      api:
        condition: service_started
    environment:
      ODOC_API_BASE_PATH: /api/v1
      ODOC_RELEASE: local
    ports:
      - "${ODOC_FRONTEND_PORT:-8081}:8080"

  worker:
    build:
      context: ../..
    environment:
      SPRING_PROFILES_ACTIVE: worker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${ODOC_DATABASE_NAME:-odoc}
      SPRING_DATASOURCE_USERNAME: ${ODOC_DATABASE_USERNAME:-odoc}
      SPRING_DATASOURCE_PASSWORD: ${ODOC_DATABASE_PASSWORD:-odoc}
    depends_on:
      postgres:
        condition: service_healthy
