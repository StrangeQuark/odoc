services:
  api:
    build:
      context: ../..
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${ODOC_DATABASE_NAME:-odoc}
      SPRING_DATASOURCE_USERNAME: ${ODOC_DATABASE_USERNAME:-odoc}
      SPRING_DATASOURCE_PASSWORD: ${ODOC_DATABASE_PASSWORD:-odoc}
      ODOC_MAIL_HOST: mailpit
      ODOC_MAIL_PORT: 1025
      ODOC_OBJECT_STORAGE_ENABLED: "true"
      ODOC_OBJECT_STORAGE_ENDPOINT: http://minio:9000
      ODOC_OBJECT_STORAGE_REGION: us-east-1
      ODOC_OBJECT_STORAGE_BUCKET: ${ODOC_MEDIA_BUCKET:-odoc-media}
      ODOC_OBJECT_STORAGE_ACCESS_KEY: ${ODOC_MINIO_ROOT_USER:-odoc-minio}
      ODOC_OBJECT_STORAGE_SECRET_KEY: ${ODOC_MINIO_ROOT_PASSWORD:-odoc-minio-local-only}
      ODOC_OBJECT_STORAGE_PATH_STYLE: "true"
      ODOC_OBJECT_STORAGE_REQUIRE_TLS: "false"
      # Set ODOC_AUTH_INVITE_ONLY=true to require a workspace invitation code for account creation.
      ODOC_AUTH_INVITE_ONLY: ${ODOC_AUTH_INVITE_ONLY:-false}
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${ODOC_API_PORT:-8080}:8080"

  frontend:
    build:
      context: ../../../odoc-react
    depends_on:
      api:
        condition: service_started
    environment:
      ODOC_API_BASE_PATH: /api/v1
      ODOC_RELEASE: local
    ports:
      - "${ODOC_FRONTEND_PORT:-8081}:8080"

  worker:
    build:
      context: ../..
    environment:
      SPRING_PROFILES_ACTIVE: worker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${ODOC_DATABASE_NAME:-odoc}
      SPRING_DATASOURCE_USERNAME: ${ODOC_DATABASE_USERNAME:-odoc}
      SPRING_DATASOURCE_PASSWORD: ${ODOC_DATABASE_PASSWORD:-odoc}
    depends_on:
      postgres:
        condition: service_healthy
