services:
  api:
    build:
      context: ../..
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${ODOC_POSTGRES_DB:-odoc}
      SPRING_DATASOURCE_USERNAME: ${ODOC_POSTGRES_USER:-odoc}
      SPRING_DATASOURCE_PASSWORD: ${ODOC_POSTGRES_PASSWORD:-odoc}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../../../odoc-react
    depends_on:
      api:
        condition: service_started
    ports:
      - "8081:8080"
