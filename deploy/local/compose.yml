name: odoc-local

services:
  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_DB: ${ODOC_DATABASE_NAME:-odoc}
      POSTGRES_USER: ${ODOC_DATABASE_USERNAME:-odoc}
      POSTGRES_PASSWORD: ${ODOC_DATABASE_PASSWORD:-odoc}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${ODOC_POSTGRES_PORT:-5432}:5432"
    volumes:
      - odoc-postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${ODOC_MINIO_ROOT_USER:-odoc-minio}
      MINIO_ROOT_PASSWORD: ${ODOC_MINIO_ROOT_PASSWORD:-odoc-minio-local-only}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mc alias set local http://localhost:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD >/dev/null && mc ready local >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${ODOC_MINIO_PORT:-9000}:9000"
      - "${ODOC_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - odoc-minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${ODOC_MINIO_ROOT_USER:-odoc-minio}
      MINIO_ROOT_PASSWORD: ${ODOC_MINIO_ROOT_PASSWORD:-odoc-minio-local-only}
      ODOC_MEDIA_BUCKET: ${ODOC_MEDIA_BUCKET:-odoc-media}
    entrypoint: >-
      /bin/sh -ec 'mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD";
      mc mb --ignore-existing "local/$$ODOC_MEDIA_BUCKET"'

  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "${ODOC_MAILPIT_SMTP_PORT:-1025}:1025"
      - "${ODOC_MAILPIT_UI_PORT:-8025}:8025"

volumes:
  odoc-postgres-data:
  odoc-minio-data:
