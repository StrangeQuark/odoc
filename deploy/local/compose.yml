name: odoc-local

services:
  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_DB: ${ODOC_DATABASE_NAME:-odoc}
      POSTGRES_USER: ${ODOC_DATABASE_USERNAME:-odoc}
      POSTGRES_PASSWORD: ${ODOC_DATABASE_PASSWORD:-odoc}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${ODOC_POSTGRES_PORT:-5432}:5432"
    volumes:
      - odoc-postgres-data:/var/lib/postgresql/data

volumes:
  odoc-postgres-data:
