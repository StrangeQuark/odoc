# Enabled only by the local TLS Compose overlay or an explicitly configured deployment profile.
# Production must supply its own keystore through a secret manager, never this local PKI.
server:
  ssl:
    enabled: true
    key-store: ${ODOC_SERVER_TLS_KEY_STORE}
    key-store-password: ${ODOC_SERVER_TLS_KEY_STORE_PASSWORD}
    key-store-type: PKCS12
    key-alias: odoc-api
