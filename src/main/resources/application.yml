spring:
  application:
    name: odoc
  lifecycle:
    timeout-per-shutdown-phase: ${ODOC_SHUTDOWN_TIMEOUT:20s}
  datasource:
    url: ${ODOC_DATABASE_URL}
    username: ${ODOC_DATABASE_USERNAME}
    password: ${ODOC_DATABASE_PASSWORD}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 25MB
      # File limit matches the editor; request limit leaves room for multipart
      # boundaries and form metadata.
      max-request-size: 26MB

server:
  port: ${ODOC_SERVER_PORT:8080}
  shutdown: graceful
  # Odoc does not process X-Forwarded-* / Forwarded values from the public
  # listener. The frontend proxy removes them before forwarding a request.
  forward-headers-strategy: none
  max-http-request-header-size: ${ODOC_MAX_HTTP_REQUEST_HEADER_SIZE:16KB}
  tomcat:
    max-http-form-post-size: ${ODOC_MAX_HTTP_FORM_POST_SIZE:26MB}
    max-swallow-size: ${ODOC_MAX_HTTP_SWALLOW_SIZE:0}

odoc:
  runtime:
    mode: ${ODOC_RUNTIME_MODE:API}
  database:
    maximum-pool-size: ${ODOC_DATABASE_MAX_POOL_SIZE:10}
    minimum-idle: ${ODOC_DATABASE_MIN_IDLE:2}
    connection-timeout: ${ODOC_DATABASE_CONNECTION_TIMEOUT:5s}
    validation-timeout: ${ODOC_DATABASE_VALIDATION_TIMEOUT:3s}
    max-lifetime: ${ODOC_DATABASE_MAX_LIFETIME:25m}
    statement-timeout: ${ODOC_DATABASE_STATEMENT_TIMEOUT:15s}
    lock-timeout: ${ODOC_DATABASE_LOCK_TIMEOUT:5s}
    idle-in-transaction-timeout: ${ODOC_DATABASE_IDLE_IN_TRANSACTION_TIMEOUT:30s}
  encryption:
    managed:
      enabled: ${ODOC_MANAGED_ENCRYPTION_ENABLED:false}
      wrapping-key-base64: ${ODOC_MANAGED_ENCRYPTION_WRAPPING_KEY_BASE64:}
  object-storage:
    # Production must explicitly opt in with an HTTPS S3-compatible endpoint.
    enabled: ${ODOC_OBJECT_STORAGE_ENABLED:false}
    endpoint: ${ODOC_OBJECT_STORAGE_ENDPOINT:}
    region: ${ODOC_OBJECT_STORAGE_REGION:us-east-1}
    bucket: ${ODOC_OBJECT_STORAGE_BUCKET:odoc-media}
    access-key: ${ODOC_OBJECT_STORAGE_ACCESS_KEY:}
    secret-key: ${ODOC_OBJECT_STORAGE_SECRET_KEY:}
    path-style: ${ODOC_OBJECT_STORAGE_PATH_STYLE:false}
    require-tls: ${ODOC_OBJECT_STORAGE_REQUIRE_TLS:true}
  auth:
    local-registration-enabled: ${ODOC_AUTH_LOCAL_REGISTRATION_ENABLED:false}
    # Set true to require a workspace invitation code whenever a local account is created.
    # This does not disable sign-in, password recovery, or invitation redemption.
    invite-only: ${ODOC_AUTH_INVITE_ONLY:false}
    instance-scope-id: ${ODOC_AUTH_INSTANCE_SCOPE_ID:00000000-0000-0000-0000-000000000001}
    session-ttl: ${ODOC_AUTH_SESSION_TTL:12h}
    secure-cookies: ${ODOC_AUTH_SECURE_COOKIES:true}
    fresh-authentication-ttl: ${ODOC_AUTH_FRESH_AUTHENTICATION_TTL:15m}
    login-account-attempt-limit: ${ODOC_AUTH_LOGIN_ACCOUNT_ATTEMPT_LIMIT:5}
    login-ip-attempt-limit: ${ODOC_AUTH_LOGIN_IP_ATTEMPT_LIMIT:25}
    login-rate-limit-window: ${ODOC_AUTH_LOGIN_RATE_LIMIT_WINDOW:15m}
    login-rate-limit-block: ${ODOC_AUTH_LOGIN_RATE_LIMIT_BLOCK:15m}
    invitation-exchange-attempt-limit: ${ODOC_AUTH_INVITATION_EXCHANGE_ATTEMPT_LIMIT:20}
    invitation-exchange-rate-limit-window: ${ODOC_AUTH_INVITATION_EXCHANGE_RATE_LIMIT_WINDOW:15m}
    invitation-exchange-rate-limit-block: ${ODOC_AUTH_INVITATION_EXCHANGE_RATE_LIMIT_BLOCK:15m}
  security:
    # Keep this empty for the same-origin frontend deployment. Supplying a
    # comma-separated list permits only those explicit browser origins.
    allowed-origins: ${ODOC_SECURITY_ALLOWED_ORIGINS:}
    reject-forwarded-headers: ${ODOC_SECURITY_REJECT_FORWARDED_HEADERS:true}
  github:
    api-base-url: ${ODOC_GITHUB_API_BASE_URL:https://api.github.com/repos}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
